name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        run: go test -race ./... -count=1
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: petauron/vastora
          ref: d194199dbc0dfac0f84f8218e61526a865ba0753
          path: vastora
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install reviewed UI dependencies
        run: |
          npm ci --prefix vastora/web
          npm ci --prefix ui
      - name: Verify app interface
        env:
          VASTORA_WEB_SOURCE: ${{ github.workspace }}/vastora/web/src
        run: |
          npm run check --prefix ui
          npm test --prefix ui
      - name: Build independently delivered UI
        env:
          VASTORA_WEB_SOURCE: ${{ github.workspace }}/vastora/web/src
        run: |
          npm run build --prefix ui
          test -s ui/dist/ui-meridian-0.1.0-alpha.9.js
          test -s ui/dist/ui-meridian-0.1.0-alpha.9.css
          test "$(wc -c < ui/dist/ui-meridian-0.1.0-alpha.9.js)" -le 4194304
          test "$(wc -c < ui/dist/ui-meridian-0.1.0-alpha.9.css)" -le 4194304
          ! grep -Fq 'process.env.NODE_ENV' ui/dist/ui-meridian-0.1.0-alpha.9.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meridian-ui-0.1.0-alpha.9
          path: |
            ui/dist/ui-meridian-0.1.0-alpha.9.js
            ui/dist/ui-meridian-0.1.0-alpha.9.css
          if-no-files-found: error
